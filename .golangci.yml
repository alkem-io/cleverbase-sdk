# Enforcing golangci-lint (v2) config for the Go binding and the Go demo.
version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # The binding is a thin cgo shim: unsafe.Pointer conversions and a C-bytes copy are
      # inherent to the FFI boundary and are reviewed by hand, not flagged per call site.
      - path: bindings/go/cleverbase\.go
        linters: [gosec]
        text: "G103|G115"
      # gocritic's dupSubExpr misreads the cgo macro expansion of a C.func call as `x == x`.
      - path: bindings/go/cleverbase\.go
        linters: [gocritic]
        text: "dupSubExpr"
      # The reference E2E intentionally shells out to `openssl` to validate produced signatures;
      # the arguments are test-controlled fixture paths, not external input.
      - path: examples/reference-integration/.*_test\.go
        linters: [gosec]
        text: "G204"
      # The mock upstream is a deliberate test double: it loads fixtures by configured path (G304),
      # mirrors the OAuth redirect_uri back to the caller (G710), and drives openssl for the RFC 3161
      # TSA (G204). These patterns are inherent to standing in for Cleverbase, not production risks.
      - path: examples/reference-integration/mock-upstream/
        linters: [gosec]
      # The result endpoint streams the SDK-produced signed PDF as application/pdf; gosec's XSS taint
      # check (G705) does not apply to a non-HTML binary response.
      - path: examples/reference-integration/signing-service/internal/httpapi/service\.go
        linters: [gosec]
        text: "G705"
