[package]
name = "cleverbase-ffi"
version = "0.2.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/cleverbase-ffi"
description = "Stable C ABI (CBOR request in / result out) over cleverbase-core, for cgo and other consumers."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
cleverbase-core = { path = "../cleverbase-core" }
cleverbase-attestation = { path = "../cleverbase-attestation" }

[dev-dependencies]
ciborium.workspace = true
# Enable the shared test vectors so the C-ABI smoke test can drive a VALID verification end-to-end
# without re-implementing the issuer side (the minting logic lives once, in the attestation crate).
cleverbase-attestation = { path = "../cleverbase-attestation", features = ["test-vectors"] }

[lints]
workspace = true
