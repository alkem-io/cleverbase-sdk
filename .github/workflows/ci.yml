name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Rust core + C ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (includes OpenSSL independent validation)
        run: cargo test --workspace

  python:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin pytest cbor2
      - run: maturin develop
        working-directory: bindings/python
      - run: pytest tests
        working-directory: bindings/python

  node:
    name: Node binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: bindings/node
      - run: npm run build
        working-directory: bindings/node
      - run: npm test
        working-directory: bindings/node

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cargo build -p cleverbase-ffi
      - name: Test (link the C ABI shared lib)
        run: LD_LIBRARY_PATH=$PWD/target/debug go test ./...
        working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug

  frontend:
    name: Frontend helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend/helper-ts
      - run: npm run build
        working-directory: frontend/helper-ts
      - run: npm test
        working-directory: frontend/helper-ts
