name: Native SDK release

# The Go binding is a nested module, so its SemVer tags are namespaced as bindings/go/vX.Y.Z.
# Pull requests exercise the complete native build/package matrix without publishing. Publishing a
# matching GitHub Release attaches the same checksum-paired archives to that release.
on:
  pull_request:
    paths:
      - ".github/workflows/native-release.yml"
      - "scripts/package-ffi-release.sh"
      - "scripts/test-package-ffi-release.sh"
      - "bindings/go/**"
      - "crates/cleverbase-core/**"
      - "crates/cleverbase-ffi/**"
      - "crates/cleverbase-attestation/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: cleverbase-ffi (${{ matrix.release_os }}-${{ matrix.release_arch }})
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'bindings/go/v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            release_os: linux
            release_arch: amd64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            release_os: linux
            release_arch: arm64
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            release_os: darwin
            release_arch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          ffi_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cleverbase-ffi") | .version')"
          version="$ffi_version"
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#bindings/go/v}"
            if [ "$version" = "$RELEASE_TAG" ] || [ "$version" != "$ffi_version" ]; then
              echo "::error::release tag $RELEASE_TAG must match cleverbase-ffi version $ffi_version"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        run: rustup show

      - name: Build static library
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup target add "$RUST_TARGET"
          cargo build --locked --release -p cleverbase-ffi --target "$RUST_TARGET"

      - name: Package archive and checksum
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_OS: ${{ matrix.release_os }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          scripts/package-ffi-release.sh \
            "$RELEASE_VERSION" "$RELEASE_OS" "$RELEASE_ARCH" \
            "target/$RUST_TARGET/release/libcleverbase_ffi.a" dist
          tar -tzf "dist/cleverbase-ffi-v${RELEASE_VERSION}-${RELEASE_OS}-${RELEASE_ARCH}.tar.gz"

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cleverbase-ffi-${{ matrix.release_os }}-${{ matrix.release_arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach native libraries
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'bindings/go/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: cleverbase-ffi-*
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: for checksum in *.sha256; do sha256sum -c "$checksum"; done

      - name: Attach files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
