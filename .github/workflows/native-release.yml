name: Native SDK release

# The Go binding is a nested module, so its SemVer tags are namespaced as bindings/go/vX.Y.Z.
# Pull requests and manual runs exercise the complete native build/package matrix without publishing.
# Pushing a namespaced tag creates (or repairs) its GitHub Release from the verified build outputs.
on:
  pull_request:
    paths:
      - ".github/workflows/native-release.yml"
      - "scripts/package-ffi-release.sh"
      - "scripts/test-package-ffi-release.sh"
      - "bindings/go/**"
      - "crates/cleverbase-core/**"
      - "crates/cleverbase-ffi/**"
      - "crates/cleverbase-attestation/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    tags: ["bindings/go/v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: cleverbase-ffi (${{ matrix.release_os }}-${{ matrix.release_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            release_os: linux
            release_arch: amd64
            goos: linux
            goarch: amd64
            system_ldflags: ""
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            release_os: linux
            release_arch: arm64
            goos: linux
            goarch: arm64
            system_ldflags: ""
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            release_os: darwin
            release_arch: arm64
            goos: darwin
            goarch: arm64
            system_ldflags: -framework CoreFoundation
          - runner: macos-15
            rust_target: x86_64-apple-darwin
            release_os: darwin
            release_arch: amd64
            goos: darwin
            goarch: amd64
            system_ldflags: -framework CoreFoundation
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ffi_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cleverbase-ffi") | .version')"
          version="$ffi_version"
          if [ "$EVENT_NAME" = "push" ]; then
            version="${RELEASE_TAG#bindings/go/v}"
            if [ "$version" = "$RELEASE_TAG" ] || [ "$version" != "$ffi_version" ]; then
              echo "::error::release tag $RELEASE_TAG must match cleverbase-ffi version $ffi_version"
              exit 1
            fi
            if grep -Eq 'target/debug|-Wl,-rpath' bindings/go/cleverbase.go; then
              echo "::error::release blocked: Go binding still embeds development linker paths"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        run: rustup show

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: bindings/go/go.mod

      - name: Build static library
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup target add "$RUST_TARGET"
          cargo build --locked --release -p cleverbase-ffi --target "$RUST_TARGET"

      - name: Package archive and checksum
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_OS: ${{ matrix.release_os }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          archive="$(scripts/package-ffi-release.sh \
            "$RELEASE_VERSION" "$RELEASE_OS" "$RELEASE_ARCH" \
            "target/$RUST_TARGET/release/libcleverbase_ffi.a" dist)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          tar -tzf "$archive"

      - name: Link-test the Go binding against the packaged library
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SYSTEM_LDFLAGS: ${{ matrix.system_ldflags }}
        run: |
          extract_dir="$RUNNER_TEMP/cleverbase-ffi"
          mkdir -p "$extract_dir"
          tar -xzf "$ARCHIVE" -C "$extract_dir"
          CGO_ENABLED=1 CGO_LDFLAGS="-L$extract_dir/lib $SYSTEM_LDFLAGS" \
            go test -c -o "$RUNNER_TEMP/cleverbase-go.test" .
        working-directory: bindings/go

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cleverbase-ffi-${{ matrix.release_os }}-${{ matrix.release_arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish native libraries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bindings/go/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: cleverbase-ffi-*
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: for checksum in *.sha256; do sha256sum -c "$checksum"; done

      - name: Attest native archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
