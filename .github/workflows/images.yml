# Multi-arch container build + publish for the reference integration's three images
# (signing service, web frontend, mock upstream).
#
# Follows the org's container build pattern (alkem-io/github-workflows: container-pr.yml /
# container-release.yml): build each arch on a NATIVE runner (no QEMU), push BY DIGEST, then
# assemble a multi-arch manifest list with `docker buildx imagetools create`. SBOM + SLSA provenance
# attestations are produced natively by build-push-action (cosign-verifiable). Action versions are
# pinned to the same versions the shared workflows use.
#
# Triggers, like the org workflows:
#   - pull_request  → build + push `pr-<N>` images so each PR's stack is deployable/testable
#                     (fork PRs build-only; GITHUB_TOKEN is read-only for them).
#   - push develop/main + tags v* → release images (sha-/branch/semver/latest).
#   - workflow_dispatch → manual build.
#
# All three Dockerfiles take the repository ROOT as the build context (`context: .`): the signing
# service build needs crates/ + bindings/go, and the mock image bakes tests/fixtures.
name: Images

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A PR that pushes new commits supersedes its in-flight image build.
concurrency:
  group: images-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Whether to push (and run the merge/smoke jobs): always for push/dispatch, and for same-repo PRs
  # only (fork PRs get a read-only token, so they validate the build without pushing).
  PUSH_ENABLED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  build:
    name: build ${{ matrix.image.name }} (${{ matrix.platform.pair }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: cleverbase-refsvc, dockerfile: examples/reference-integration/signing-service/Dockerfile }
          - { name: cleverbase-refweb, dockerfile: examples/reference-integration/web/Dockerfile }
          - { name: cleverbase-refmock, dockerfile: examples/reference-integration/mock-upstream/Dockerfile }
        platform:
          - { os: linux/amd64, runner: ubuntu-latest, pair: linux-amd64 }
          - { os: linux/arm64, runner: ubuntu-24.04-arm, pair: linux-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GHCR
        if: env.PUSH_ENABLED == 'true'
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.os }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH_ENABLED }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.pair }}

      - name: Export digest
        if: env.PUSH_ENABLED == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH_ENABLED == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [cleverbase-refsvc, cleverbase-refweb, cleverbase-refmock]
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.1.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Verify digest set (amd64 + arm64)
        run: |
          count=$(ls -1 "${{ runner.temp }}/digests" 2>/dev/null | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 digests (amd64 + arm64) for ${{ matrix.image }}, found ${count}."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          declare -a args
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r ann; do args+=(--annotation "$ann"); done < <(jq -cr '.annotations[]?' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${args[@]}" $(printf "${IMAGE}@sha256:%s " *)

  smoke:
    name: smoke ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    needs: merge
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
        image:
          - { name: cleverbase-refsvc, type: go, port: "8080", run_args: "-e REFSVC_AUTH_DISABLED=true -e REFSVC_BASE_URL=http://mock:9000" }
          - { name: cleverbase-refmock, type: go, port: "9000", run_args: "" }
          - { name: cleverbase-refweb, type: web, port: "8080", run_args: "" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull native-arch image + smoke
        env:
          SMOKE_RUN_ARGS: ${{ matrix.image.run_args }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            tag="pr-${PR_NUMBER}"
          else
            tag="sha-${GITHUB_SHA::7}"
          fi
          ref="${REGISTRY}/${{ github.repository_owner }}/${{ matrix.image.name }}:${tag}"
          docker pull "$ref"
          bash examples/reference-integration/scripts/smoke.sh "$ref" "${{ matrix.image.type }}" "${{ matrix.image.port }}"
