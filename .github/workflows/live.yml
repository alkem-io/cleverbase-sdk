name: Cleverbase contract paths

# The public hash-signing stub runs without secrets every night and on manual dispatch. It exercises
# the same reference-service binary as acceptance, but correctly terminates on the stub's fake
# signature. A manually selected acceptance run keeps its protected environment and is visibly
# skipped when the required secrets are absent.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Contract target
        required: true
        default: stub
        type: choice
        options:
          - stub
          - acceptance

permissions:
  contents: read

concurrency:
  group: cleverbase-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Cleverbase ${{ matrix.leg }} (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'stub' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only acceptance receives the protected environment. The stub uses no secret and its public
    # documented client values appear only in the test step below.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'acceptance' && 'live-acceptance' || 'stub-contract' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: v1_rsa
            csc_api: v1_rsa
          - leg: v2_ecdsa
            csc_api: v2_ecdsa
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Select and gate contract target
        id: gate
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'stub' }}
          CLIENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'acceptance' && ((matrix.leg == 'v1_rsa' && secrets.LIVE_CLIENT_ID_RSA) || (matrix.leg == 'v2_ecdsa' && secrets.LIVE_CLIENT_ID_ECDSA)) || '' }}
          CLIENT_SECRET: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'acceptance' && ((matrix.leg == 'v1_rsa' && secrets.LIVE_CLIENT_SECRET_RSA) || (matrix.leg == 'v2_ecdsa' && secrets.LIVE_CLIENT_SECRET_ECDSA)) || '' }}
          REDIRECT_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'acceptance' && secrets.LIVE_REDIRECT_URI || '' }}
          CA_BUNDLE_B64: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'acceptance' && secrets.LIVE_CA_BUNDLE_B64 || '' }}
        run: |
          case "$TARGET" in
            stub)
              if [ "${{ matrix.csc_api }}" != "v1_rsa" ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Skipping v2_ecdsa: Cleverbase's public hash-signing stub exposes CSC v1 RSA only."
              else
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "variant=stub" >> "$GITHUB_OUTPUT"
              fi
              ;;
            acceptance)
              if [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$REDIRECT_URI" ] && [ -n "$CA_BUNDLE_B64" ]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "variant=acceptance" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Skipping acceptance ${{ matrix.leg }}: its client credential, redirect URI, or acceptance CA bundle is not configured."
              fi
              ;;
            *)
              echo "::error::unknown contract target: $TARGET"
              exit 1
              ;;
          esac

      - name: Set up Rust (pinned via rust-toolchain.toml)
        if: steps.gate.outputs.run == 'true'
        run: rustup show

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: "1.22"
          cache-dependency-path: examples/reference-integration/signing-service/go.sum

      - name: Build the cleverbase-ffi library
        if: steps.gate.outputs.run == 'true'
        run: cargo build -p cleverbase-ffi

      # Acceptance requires an independently supplied issuer bundle. The public stub cannot produce
      # a verifiable signature, so it deliberately has no trust-bundle bypass or materialization path.
      - name: Materialize the acceptance trust bundle
        if: steps.gate.outputs.variant == 'acceptance'
        env:
          CA_BUNDLE_B64: ${{ secrets.LIVE_CA_BUNDLE_B64 }}
        run: printf '%s' "$CA_BUNDLE_B64" | base64 -d > "$RUNNER_TEMP/live-ca-bundle.pem"

      - name: Run public stub contract suite
        if: steps.gate.outputs.variant == 'stub'
        working-directory: examples/reference-integration/signing-service
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          REFSVC_MODE: live
          REFSVC_ENV: acceptance
          REFSVC_CSC_API: v1_rsa
          REFSVC_CLIENT_ID: 6dd5f48d-bcd9-4a98-8a4c-5c82182f5be4
          REFSVC_CLIENT_SECRET: 11628999-cb61-4c62-8e1f-09699dcb5521
          REFSVC_REDIRECT_URI: http://localhost:8080/oauth/cleverbase/callback
          REFSVC_UPSTREAM_BASE_URL: https://trust-driver-stub-hash-signing.cleverbase.com
        run: go test -race -run '^TestCleverbaseHashSigningStub$' -v ./e2e/

      # Stub and acceptance have different trust and secret boundaries. Separate steps make those
      # boundaries explicit instead of relying on a falsy middle operand in a GitHub expression.
      - name: Run acceptance contract suite
        if: steps.gate.outputs.variant == 'acceptance'
        working-directory: examples/reference-integration/signing-service
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          REFSVC_MODE: live
          REFSVC_ENV: acceptance
          REFSVC_CSC_API: ${{ matrix.csc_api }}
          REFSVC_CLIENT_ID: ${{ matrix.leg == 'v1_rsa' && secrets.LIVE_CLIENT_ID_RSA || secrets.LIVE_CLIENT_ID_ECDSA || '' }}
          REFSVC_CLIENT_SECRET: ${{ matrix.leg == 'v1_rsa' && secrets.LIVE_CLIENT_SECRET_RSA || secrets.LIVE_CLIENT_SECRET_ECDSA || '' }}
          REFSVC_REDIRECT_URI: ${{ secrets.LIVE_REDIRECT_URI }}
          REFSVC_TSA_URL: ${{ secrets.LIVE_TSA_URL }}
          REFSVC_LIVE_AUTHORIZER: headless
        run: |
          export REFSVC_LIVE_CA_BUNDLE="$RUNNER_TEMP/live-ca-bundle.pem"
          go test -race -run '^TestLive$' -v ./e2e/
