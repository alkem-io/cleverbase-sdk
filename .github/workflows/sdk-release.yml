name: SDK release

# One namespaced Go-module tag owns the coordinated native, Go, Python and Node release.
# Pull requests and manual runs build and test the exact package pipeline without publish authority.
on:
  pull_request:
    paths:
      - ".github/workflows/sdk-release.yml"
      - "SDK_VERSION"
      - "scripts/**"
      - "bindings/go/**"
      - "bindings/python/**"
      - "bindings/node/**"
      - "crates/cleverbase-core/**"
      - "crates/cleverbase-ffi/**"
      - "crates/cleverbase-attestation/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "README.md"
      - "LICENSE"
  push:
    tags: ["bindings/go/v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel an in-flight tag publication; only PR dry-runs are replaceable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-identity:
    name: Release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind version, tag and commit
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          tag="bindings/go/v${version}"
          if [ "$EVENT_NAME" = "push" ]; then
            [ "$RELEASE_REF" = "$tag" ] || {
              echo "::error::release tag $RELEASE_REF must be $tag"
              exit 1
            }
            [ "$(git cat-file -t "$tag")" = "tag" ] || {
              echo "::error::release tag must be annotated"
              exit 1
            }
            [ "$(git rev-list -n 1 "$tag")" = "$RELEASE_COMMIT" ] || {
              echo "::error::release tag does not peel to the workflow commit"
              exit 1
            }
          fi
          python3 scripts/sdk-version.py check --tag "$tag"
          if grep -Eq 'target/debug|-Wl,-rpath' bindings/go/cleverbase.go; then
            echo "::error::release blocked: Go binding still embeds development linker paths"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$RELEASE_COMMIT"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Release contracts
    needs: release-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest==9.1.1
      - name: Version and package metadata
        run: |
          python scripts/sdk-version.py check --tag "${{ needs.release-identity.outputs.tag }}"
          python scripts/check-sdk-package-metadata.py
      - name: Release contract tests
        run: |
          python -m pytest -q scripts/
          bash scripts/test-package-ffi-release.sh
          bash scripts/test-package-node-release.sh

  binding-coverage:
    name: Binding coverage (${{ matrix.binding }})
    needs: release-identity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        binding: [python, node, go]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup show
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.binding == 'python'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.binding == 'node'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: matrix.binding == 'go'
        with:
          go-version-file: bindings/go/go.mod
      - name: Prepare Python binding
        if: matrix.binding == 'python'
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin==1.14.1 pytest==9.1.1 cbor2==6.1.2
      - name: Prepare Node binding
        if: matrix.binding == 'node'
        run: npm ci
        working-directory: bindings/node
      - name: Install coverage tool
        if: matrix.binding != 'go'
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Enforce published binding coverage
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
        run: bash scripts/test-binding-coverage.sh "${{ matrix.binding }}"

  build-platform:
    name: Build (${{ matrix.release_os }}-${{ matrix.release_arch }})
    needs: release-identity
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            release_os: linux
            release_arch: amd64
            node_file: cleverbase.linux-x64-gnu.node
            wheel_tag: cp39-abi3-manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            release_os: linux
            release_arch: arm64
            node_file: cleverbase.linux-arm64-gnu.node
            wheel_tag: cp39-abi3-manylinux_2_28_aarch64
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            release_os: darwin
            release_arch: amd64
            node_file: cleverbase.darwin-x64.node
            wheel_tag: cp39-abi3-macosx_11_0_x86_64
          - runner: macos-15
            rust_target: aarch64-apple-darwin
            release_os: darwin
            release_arch: arm64
            node_file: cleverbase.darwin-arm64.node
            wheel_tag: cp39-abi3-macosx_11_0_arm64
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      GLIBC_MAX: "2.28"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup show
          rustup target add "$RUST_TARGET"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.9"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: bindings/go/go.mod
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.release_os == 'linux'
        with:
          version: 0.13.0
      - name: Install package builders
        run: |
          python -m pip install maturin==1.14.1
          npm ci
        working-directory: bindings/node
      - name: Build and package native archive
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
          RELEASE_OS: ${{ matrix.release_os }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
          SOURCE_DATE_EPOCH: "946684800"
        run: |
          cargo build --locked --release -p cleverbase-ffi --target "$RUST_TARGET"
          scripts/package-ffi-release.sh \
            "$RELEASE_VERSION" "$RELEASE_OS" "$RELEASE_ARCH" \
            "target/$RUST_TARGET/release/libcleverbase_ffi.a" dist/native
      - name: Build Node native module
        env:
          RELEASE_OS: ${{ matrix.release_os }}
          RUST_TARGET: ${{ matrix.rust_target }}
          NODE_FILE: ${{ matrix.node_file }}
        run: |
          extra=()
          if [ "$RELEASE_OS" = "linux" ]; then
            extra+=(--zig --zig-abi-suffix "$GLIBC_MAX")
          fi
          npm exec -- napi build --platform --js false --release \
            --target "$RUST_TARGET" "${extra[@]}"
          mkdir -p ../../dist/node
          cp "$NODE_FILE" "../../dist/node/$NODE_FILE"
        working-directory: bindings/node
      - name: Assert Node binary architecture and ABI baseline
        env:
          RELEASE_OS: ${{ matrix.release_os }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
          NODE_FILE: ${{ matrix.node_file }}
        run: |
          binary="dist/node/$NODE_FILE"
          file "$binary"
          case "$RELEASE_OS-$RELEASE_ARCH" in
            linux-amd64) file "$binary" | grep -q 'x86-64' ;;
            linux-arm64) file "$binary" | grep -Eq 'aarch64|ARM64' ;;
            darwin-amd64) file "$binary" | grep -q 'x86_64' ;;
            darwin-arm64) file "$binary" | grep -q 'arm64' ;;
          esac
          if [ "$RELEASE_OS" = "linux" ]; then
            newest="$(readelf --version-info "$binary" \
              | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' \
              | sed 's/GLIBC_//' \
              | sort -V \
              | tail -n 1)"
            python3 - "$newest" "$GLIBC_MAX" <<'PY'
          import sys
          actual = tuple(map(int, sys.argv[1].split(".")))
          maximum = tuple(map(int, sys.argv[2].split(".")))
          if actual > maximum:
              raise SystemExit(f"Node binary requires GLIBC {actual}, above {maximum}")
          PY
          else
            otool -l "$binary" | awk '
              /LC_BUILD_VERSION/ { in_build=1; next }
              in_build && /minos/ { found=1; if ($2 != "11.0") exit 1 }
              END { if (!found) exit 1 }
            '
          fi
      - name: Build Python wheel
        env:
          RELEASE_OS: ${{ matrix.release_os }}
          RUST_TARGET: ${{ matrix.rust_target }}
          WHEEL_TAG: ${{ matrix.wheel_tag }}
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
        run: |
          extra=()
          if [ "$RELEASE_OS" = "linux" ]; then
            extra+=(--zig --compatibility manylinux_2_28)
          fi
          python -m maturin build \
            --manifest-path bindings/python/Cargo.toml \
            --locked --release --target "$RUST_TARGET" \
            --out dist/python "${extra[@]}"
          wheel="dist/python/alkemio_cleverbase_sdk-${RELEASE_VERSION}-${WHEEL_TAG}.whl"
          python scripts/check_sdk_artifact.py python-wheel "$wheel" "$RELEASE_VERSION" "$WHEEL_TAG"
      - name: Upload platform components
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-platform-${{ matrix.release_os }}-${{ matrix.release_arch }}
          path: |
            dist/native/*
            dist/node/*
            dist/python/*
          if-no-files-found: error

  assemble:
    name: Assemble immutable SDK release
    needs: [release-identity, quality, build-platform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: components
          pattern: sdk-platform-*
          merge-multiple: true
      - name: Assemble final packages
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
        run: |
          mkdir -p dist
          cp components/native/* dist/
          cp components/python/* dist/
          scripts/package-node-release.sh "$RELEASE_VERSION" components/node dist
          python -m pip install maturin==1.14.1
          python -m maturin sdist \
            --manifest-path bindings/python/Cargo.toml \
            --out dist
          python scripts/check_sdk_artifact.py node \
            "dist/alkemio-cleverbase-sdk-${RELEASE_VERSION}.tgz" "$RELEASE_VERSION"
          python scripts/check_sdk_artifact.py python-sdist \
            "dist/alkemio_cleverbase_sdk-${RELEASE_VERSION}.tar.gz" "$RELEASE_VERSION"
      - name: Verify every platform wheel
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
        run: |
          while read -r tag; do
            wheel="dist/alkemio_cleverbase_sdk-${RELEASE_VERSION}-${tag}.whl"
            python scripts/check_sdk_artifact.py python-wheel "$wheel" "$RELEASE_VERSION" "$tag"
          done <<'EOF'
          cp39-abi3-manylinux_2_28_x86_64
          cp39-abi3-manylinux_2_28_aarch64
          cp39-abi3-macosx_11_0_x86_64
          cp39-abi3-macosx_11_0_arm64
          EOF
      - name: Bind artifact bytes to release identity
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
          RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-identity.outputs.commit }}
        run: |
          manifest="dist/sdk-artifacts-v${RELEASE_VERSION}.json"
          python scripts/sdk_artifact_manifest.py create \
            dist "$manifest" "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT"
          python scripts/sdk_artifact_manifest.py verify \
            dist "$manifest" "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Upload immutable release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-release
          path: dist/*
          if-no-files-found: error

  test-node-package:
    name: Test npm package (${{ matrix.release_os }}-${{ matrix.release_arch }})
    needs: [release-identity, assemble]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            release_os: linux
            release_arch: amd64
          - runner: ubuntu-24.04-arm
            release_os: linux
            release_arch: arm64
          - runner: macos-15-intel
            release_os: darwin
            release_arch: amd64
          - runner: macos-15
            release_os: darwin
            release_arch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release
          path: dist
      - name: Clean-install and test the assembled tarball
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
        run: scripts/test-node-release-artifact.sh "dist/alkemio-cleverbase-sdk-${RELEASE_VERSION}.tgz"

  test-python-wheel:
    name: Test Python wheel (${{ matrix.release_os }}-${{ matrix.release_arch }})
    needs: [release-identity, assemble]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            release_os: linux
            release_arch: amd64
            wheel_tag: cp39-abi3-manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            release_os: linux
            release_arch: arm64
            wheel_tag: cp39-abi3-manylinux_2_28_aarch64
          - runner: macos-15-intel
            release_os: darwin
            release_arch: amd64
            wheel_tag: cp39-abi3-macosx_11_0_x86_64
          - runner: macos-15
            release_os: darwin
            release_arch: arm64
            wheel_tag: cp39-abi3-macosx_11_0_arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.9"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release
          path: dist
      - name: Clean-install and test the assembled wheel
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
          WHEEL_TAG: ${{ matrix.wheel_tag }}
        run: scripts/test-python-release-artifact.sh "dist/alkemio_cleverbase_sdk-${RELEASE_VERSION}-${WHEEL_TAG}.whl"

  test-python-sdist:
    name: Test Python sdist
    needs: [release-identity, assemble]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.9"
      - name: Set up Rust
        run: rustup show
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release
          path: dist
      - name: Build, clean-install and test the assembled sdist
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
        run: scripts/test-python-release-artifact.sh "dist/alkemio_cleverbase_sdk-${RELEASE_VERSION}.tar.gz"

  test-native-archive:
    name: Test native archive (${{ matrix.release_os }}-${{ matrix.release_arch }})
    needs: [release-identity, assemble]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            release_os: linux
            release_arch: amd64
          - runner: ubuntu-24.04-arm
            release_os: linux
            release_arch: arm64
          - runner: macos-15-intel
            release_os: darwin
            release_arch: amd64
          - runner: macos-15
            release_os: darwin
            release_arch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: bindings/go/go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release
          path: dist
      - name: Link and test against the assembled native archive
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
          RELEASE_OS: ${{ matrix.release_os }}
          RELEASE_ARCH: ${{ matrix.release_arch }}
        run: scripts/test-native-release-artifact.sh "dist/cleverbase-ffi-v${RELEASE_VERSION}-${RELEASE_OS}-${RELEASE_ARCH}.tar.gz"

  publish-github:
    name: Stage GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bindings/go/v')
    needs:
      - release-identity
      - binding-coverage
      - assemble
      - test-node-package
      - test-python-wheel
      - test-python-sdist
      - test-native-archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release
          path: dist
      - name: Verify the immutable artifact set
        env:
          RELEASE_VERSION: ${{ needs.release-identity.outputs.version }}
          RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-identity.outputs.commit }}
        run: python scripts/sdk_artifact_manifest.py verify dist "dist/sdk-artifacts-v${RELEASE_VERSION}.json" "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Create draft release and upload only missing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-identity.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes
          fi
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          remote_dir="$RUNNER_TEMP/github-release"
          mkdir -p "$remote_dir"
          local_names="$(find dist -maxdepth 1 -type f -exec basename {} \; | sort)"
          remote_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          unexpected="$(comm -13 <(printf '%s\n' "$local_names") <(printf '%s\n' "$remote_names"))"
          [ -z "$unexpected" ] || {
            printf '::error::unexpected GitHub release assets:\n%s\n' "$unexpected"
            exit 1
          }
          while IFS= read -r name; do
            if printf '%s\n' "$remote_names" | grep -Fxq "$name"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$remote_dir"
              cmp "dist/$name" "$remote_dir/$name" || {
                echo "::error::GitHub release asset differs: $name"
                exit 1
              }
            else
              [ "$is_draft" = "true" ] || {
                echo "::error::published GitHub release is missing asset: $name"
                exit 1
              }
              gh release upload "$RELEASE_TAG" "dist/$name"
            fi
          done <<< "$local_names"
      - name: Attest final release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish-pypi:
    name: Publish PyPI package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bindings/go/v')
    needs: publish-github
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release
          path: dist
      - name: Prepare and reconcile Python distributions
        id: preflight
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          mkdir python-dist
          cp dist/alkemio_cleverbase_sdk-*.whl python-dist/
          cp "dist/alkemio_cleverbase_sdk-${version}.tar.gz" python-dist/
          status="$(python scripts/release_registry.py pypi preflight python-dist "$version")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Publish only missing PyPI files via trusted publishing
        if: steps.preflight.outputs.status == 'missing'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python-dist
          skip-existing: true
          attestations: true
      - name: Verify PyPI bytes and registry attestations
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          python scripts/release_registry.py pypi verify python-dist "$version"
          python -m pip install pypi-attestations==0.0.30
          for artifact in python-dist/*; do
            pypi-attestations verify pypi "$artifact" \
              --repository https://github.com/alkem-io/cleverbase-sdk
          done

  publish-npm:
    name: Publish npm package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bindings/go/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release
          path: dist
      - name: Assert trusted-publishing npm client floor
        run: |
          node --version
          npm --version
          npm_major="$(npm --version | cut -d. -f1)"
          npm_minor="$(npm --version | cut -d. -f2)"
          if [ "$npm_major" -lt 11 ] || { [ "$npm_major" -eq 11 ] && [ "$npm_minor" -lt 5 ]; }; then
            echo "::error::npm >=11.5.1 is required for trusted publishing"
            exit 1
          fi
      - name: Reconcile npm package
        id: preflight
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          package="dist/alkemio-cleverbase-sdk-${version}.tgz"
          status="$(python3 scripts/release_registry.py npm preflight "$package" "$version")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Publish missing npm package with provenance
        if: steps.preflight.outputs.status == 'missing'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish "dist/alkemio-cleverbase-sdk-${version}.tgz" \
            --access public --provenance --registry https://registry.npmjs.org/
      - name: Verify npm bytes and provenance
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          python3 scripts/release_registry.py npm verify \
            "dist/alkemio-cleverbase-sdk-${version}.tgz" "$version"

  complete-release:
    name: Verify and publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/bindings/go/v')
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: bindings/go/go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-release
          path: dist
      - name: Verify every destination and clean registry install
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          python scripts/sdk_artifact_manifest.py verify \
            dist "dist/sdk-artifacts-v${version}.json" "$version" "$RELEASE_TAG" "$GITHUB_SHA"
          python_dir="$RUNNER_TEMP/python-dist"
          mkdir "$python_dir"
          cp dist/alkemio_cleverbase_sdk-*.whl "$python_dir/"
          cp "dist/alkemio_cleverbase_sdk-${version}.tar.gz" "$python_dir/"
          python scripts/release_registry.py pypi verify "$python_dir" "$version"
          python -m pip install pypi-attestations==0.0.30
          for artifact in "$python_dir"/*; do
            pypi-attestations verify pypi "$artifact" \
              --repository https://github.com/alkem-io/cleverbase-sdk
          done
          python scripts/release_registry.py npm verify \
            "dist/alkemio-cleverbase-sdk-${version}.tgz" "$version"
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "$GH_REPO"
          done
          clean_python="$RUNNER_TEMP/python"
          python -m venv "$clean_python"
          "$clean_python/bin/pip" install --only-binary=:all: \
            "alkemio-cleverbase-sdk==${version}"
          "$clean_python/bin/python" -c 'import cleverbase'
          clean_node="$RUNNER_TEMP/node"
          mkdir "$clean_node"
          npm install --prefix "$clean_node" \
            "@alkemio/cleverbase-sdk@${version}"
          node -e "require('$clean_node/node_modules/@alkemio/cleverbase-sdk')"
          (
            cd "$clean_node"
            npm audit signatures
          )
          go mod download "github.com/alkem-io/cleverbase-sdk/bindings/go@v${version}"
      - name: Complete the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest=false
