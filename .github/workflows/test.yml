name: Tests

# Scope `push` to the protected branches (matching docs.yml / images.yml): a push to a feature branch
# with an open PR would otherwise run every job TWICE (once for push, once for pull_request). Feature
# branches are tested via `pull_request`; the concurrency group supersedes an in-flight run on a newer
# commit to the same PR/ref.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust core + attestation + C ABI (test + coverage ≥95%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust (version + components pinned via rust-toolchain.toml)
        run: rustup show
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Test (includes OpenSSL independent validation)
        run: cargo test --workspace
      # Constitution Principle VI: unit-test line coverage MUST stay ≥95% per crate. All protocol,
      # CMS/PAdES, timestamp, and EUDI attestation logic lives in these three crates (the bindings are
      # thin shims). The attestation always-on verify suite is offline with zero external deps (its
      # trust lists/status/issuer are sans-IO host seams fed by in-crate fixtures), so it runs here
      # unconditionally alongside the signing core — the gated cross-check/issuance/qualified jobs are
      # the opt-in workflows.
      - name: Coverage gate — cleverbase-core
        run: cargo llvm-cov --package cleverbase-core --fail-under-lines 95
      - name: Coverage gate — cleverbase-ffi
        run: cargo llvm-cov --package cleverbase-ffi --fail-under-lines 95
      - name: Coverage gate — cleverbase-attestation
        run: cargo llvm-cov --package cleverbase-attestation --fail-under-lines 95

  python:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # maturin needs a virtualenv; create one at the repo root (maturin finds it from the subdir).
      - name: Create virtualenv
        run: python -m venv .venv
      - name: Install build + test deps
        # Pinned for reproducible builds/tests (same versions the lint job's mypy uses).
        run: .venv/bin/pip install maturin==1.14.1 pytest==9.1.1 cbor2==6.1.2
      - name: Build the extension (into the venv)
        run: ../../.venv/bin/maturin develop
        working-directory: bindings/python
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - name: pytest
        run: ../../.venv/bin/pytest tests
        working-directory: bindings/python

  node:
    name: Node binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - run: npm install
        working-directory: bindings/node
      - run: npm run build
        working-directory: bindings/node
      - run: npm test
        working-directory: bindings/node

  go:
    name: Go binding (test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.22"
      - run: cargo build -p cleverbase-ffi
      - name: Test + coverage
        working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: |
          go test -coverprofile=cover.out ./...
          total="$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')"
          echo "Go binding statement coverage: ${total}%"
          # The thin cgo shim's remaining lines are unreachable defensive branches (the C-ABI
          # non-zero status, init/decode failure). Gate against regression at the achievable floor.
          awk "BEGIN { exit !(${total} >= 80) }" || { echo "Go coverage ${total}% < 80%"; exit 1; }

  frontend:
    name: Frontend helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend/helper-ts
      - run: npm run build
        working-directory: frontend/helper-ts
      - run: npm test
        working-directory: frontend/helper-ts

  reference-integration:
    name: Reference integration (service + mock + credential-free E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.22"
      - name: Build the cleverbase-ffi library
        run: cargo build -p cleverbase-ffi
      - name: Signing service unit tests + ≥95% coverage gate
        working-directory: examples/reference-integration/signing-service
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: |
          # Coverage scoped to the signing-service packages only (mock/web/deploy exempt — FR-024).
          # cmd/refsvc is intentionally OUTSIDE this gate: it is the thin main()/wiring entrypoint
          # (config.Load → assemble the engine/service → http.Server + signal-driven shutdown) that
          # holds no protocol/crypto logic. It is exercised by the credential-free E2E (which boots
          # the real service wiring) rather than unit tests, so per the maintainer decision it is
          # exempt from the ≥95% unit-coverage bar. Keep this gate scoped to ./internal/... only.
          go test -coverprofile=cover.out ./internal/...
          total="$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')"
          echo "signing-service statement coverage: ${total}%"
          awk "BEGIN { exit !(${total} >= 95) }" || { echo "coverage ${total}% < 95%"; exit 1; }
      - name: Mock upstream tests
        working-directory: examples/reference-integration/mock-upstream
        run: go test ./...
      - name: Web BFF build
        working-directory: examples/reference-integration/web
        run: go build -o /dev/null ./server
      # The credential-free E2E spins up the mock + service in-process (no Cleverbase credentials) and
      # OpenSSL-validates the produced B-B and B-T signatures for BOTH RSA (v1) and ECDSA P-256 (v2) — the
      # `go test ./e2e/...` table runs every {v1_rsa, v2_ecdsa} x {B-B, B-T} arm; auth stays enabled
      # (FR-021/SC-002; ECDSA parity per spec 003 FR-002/SC-001).
      - name: Credential-free E2E (OpenSSL-validated B-B + B-T, RSA + ECDSA)
        working-directory: examples/reference-integration/signing-service
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: go test ./e2e/...
