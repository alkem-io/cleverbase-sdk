name: Lint

# Scope `push` to the protected branches (matching docs.yml / images.yml): a push to a feature branch
# that already has an open PR would otherwise trigger BOTH the push run and the pull_request run — the
# same jobs twice. Feature-branch commits are linted via the `pull_request` event; the concurrency group
# supersedes an in-flight run when a newer commit lands on the same PR/ref.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: linting never needs write access to the repo.
permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust (version + components pinned via rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (core + C ABI — pedantic + nursery, warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (Python binding crate)
        run: cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets -- -D warnings
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - name: Clippy (Node binding crate)
        run: cargo clippy --manifest-path bindings/node/Cargo.toml --all-targets -- -D warnings

  python:
    name: Python (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # mypy --strict type-checks bindings/python/tests too, so the test deps must be present (pytest
      # ships stubs; cbor2 is a stubless C ext handled by an ignore_missing_imports override in
      # pyproject). Pin every tool for deterministic lint results.
      - run: pip install ruff==0.15.19 mypy==2.1.0 pytest==9.1.1 cbor2==6.1.2
      - name: Ruff lint (select = ALL)
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy .
        working-directory: bindings/python

  web:
    name: Web (eslint + prettier + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Install root tooling
        run: npm install --no-save
      - name: Install + build frontend helper
        # Build the helper so dist/index.d.ts exists: the web example imports its published types,
        # and ESLint's type-aware rules resolve them to `any` (no-unsafe-*) if the package is unbuilt.
        run: npm install --no-save && npm run build
        working-directory: frontend/helper-ts
      - name: Type-check (TypeScript, strict)
        run: npx tsc --noEmit
        working-directory: frontend/helper-ts
      - name: "Install web example deps (links the file: helper so its types resolve)"
        run: npm install
        working-directory: examples/reference-integration/web
      - name: Type-check web example (TypeScript, strict)
        run: npx tsc --noEmit
        working-directory: examples/reference-integration/web
      - name: ESLint
        run: npx eslint .
      - name: Prettier
        run: npx prettier --check .

  go:
    name: Go (gofmt + vet + golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust (version + components pinned via rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.22"
      - name: Build C ABI (for cgo link + analysis)
        run: cargo build -p cleverbase-ffi
      - name: gofmt
        run: |
          unformatted="$(gofmt -l bindings/go examples/go_demo examples/reference-integration/signing-service examples/reference-integration/mock-upstream examples/reference-integration/web)"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - name: go vet (binding)
        working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/debug"
        run: go vet ./...
      - name: golangci-lint (binding)
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/debug"
      - name: golangci-lint (demo)
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: examples/go_demo
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/debug"
      - name: golangci-lint (reference signing service)
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: examples/reference-integration/signing-service
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/debug"
      - name: golangci-lint (reference mock upstream)
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: examples/reference-integration/mock-upstream
      - name: golangci-lint (reference web BFF)
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: examples/reference-integration/web
