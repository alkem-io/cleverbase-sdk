name: Lint

on:
  push:
  pull_request:

# Least privilege: linting never needs write access to the repo.
permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          persist-credentials: false
      - name: Set up Rust (version + components pinned via rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (core + C ABI — pedantic + nursery, warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Clippy (Python binding crate)
        run: cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets -- -D warnings
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - name: Clippy (Node binding crate)
        run: cargo clippy --manifest-path bindings/node/Cargo.toml --all-targets -- -D warnings

  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.18
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  web:
    name: Web (eslint + prettier + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install root tooling
        run: npm install --no-save
      - name: Install frontend deps (for tsc project)
        run: npm install --no-save
        working-directory: frontend/helper-ts
      - name: Type-check (TypeScript, strict)
        run: npx tsc --noEmit
        working-directory: frontend/helper-ts
      - name: ESLint
        run: npx eslint .
      - name: Prettier
        run: npx prettier --check .

  go:
    name: Go (gofmt + vet + golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          persist-credentials: false
      - name: Set up Rust (version + components pinned via rust-toolchain.toml)
        run: rustup show
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.0.2
        with:
          go-version: "1.22"
      - name: Build C ABI (for cgo link + analysis)
        run: cargo build -p cleverbase-ffi
      - name: gofmt
        run: |
          unformatted="$(gofmt -l bindings/go examples/go_demo)"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - name: go vet (binding)
        working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/debug"
        run: go vet ./...
      - name: golangci-lint (binding)
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v9.2.1
        with:
          version: v2.12.2
          working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/debug"
      - name: golangci-lint (demo)
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v9.2.1
        with:
          version: v2.12.2
          working-directory: examples/go_demo
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/debug"
