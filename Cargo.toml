[workspace]
resolver = "2"
members = ["crates/cleverbase-core", "crates/cleverbase-ffi"]

[workspace.package]
edition = "2021"
license = "EUPL-1.2"
rust-version = "1.83"
repository = "https://github.com/alkem-io/cleverbase-sdk"

# Enforcing lint policy (CI runs `clippy --all-targets -- -D warnings`, so every level below is a
# hard gate). clippy `pedantic` + `nursery` are on; only genuinely noisy/stylistic lints are
# allowed back, each with a reason. Crates opt in via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Foot-guns we never want, even in tests:
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Allowed back (noise / deliberate style), each justified:
missing_errors_doc = "allow"      # error types are self-describing via thiserror
missing_panics_doc = "allow"      # panics are documented inline where they matter
must_use_candidate = "allow"      # not adding #[must_use] to every getter
module_name_repetitions = "allow" # e.g. signing::SigningRequest reads fine
doc_markdown = "allow"            # proper nouns (PAdES, CSC, RFC) are not code
similar_names = "allow"           # r/s, z0/z1 etc. are domain-standard
cast_possible_truncation = "allow" # casts here are intentional + bounds-checked
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"           # the sans-IO state machine is intentionally one big match
struct_excessive_bools = "allow"   # AppearanceShow is a set of independent display flags
too_long_first_doc_paragraph = "allow"
missing_const_for_fn = "allow"     # const-ness is not part of the API contract here
items_after_statements = "allow"   # test helpers are defined where they are used
needless_pass_by_value = "allow"   # begin/resume deliberately take owned inputs
derive_partial_eq_without_eq = "allow" # several types carry f64 fields (no Eq)
unnecessary_wraps = "allow"
manual_let_else = "allow"          # an explicit match reads clearly in the state machine
format_push_string = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
ciborium = "0.2"
sha2 = "0.10"
thiserror = "2"
# AdES / X.509 / CMS (RustCrypto, der 0.7 generation)
der = { version = "0.7", features = ["alloc", "oid"] }
const-oid = { version = "0.9", features = ["db"] }
spki = "0.7"
x509-cert = "0.2"
cms = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", features = ["der"] }
signature = "2"
pkcs8 = "0.10"
lopdf = "0.36"
