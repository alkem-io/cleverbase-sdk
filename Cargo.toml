[workspace]
resolver = "2"
members = ["crates/cleverbase-core", "crates/cleverbase-ffi"]

[workspace.package]
edition = "2021"
license = "EUPL-1.2"
rust-version = "1.83"
repository = "https://github.com/alkem-io/cleverbase-sdk"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
ciborium = "0.2"
sha2 = "0.10"
thiserror = "2"
# AdES / X.509 / CMS (RustCrypto, der 0.7 generation)
der = { version = "0.7", features = ["alloc", "oid"] }
const-oid = { version = "0.9", features = ["db"] }
spki = "0.7"
x509-cert = "0.2"
cms = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", features = ["der"] }
signature = "2"
pkcs8 = "0.10"
lopdf = "0.36"
