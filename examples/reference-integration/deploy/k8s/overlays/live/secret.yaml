# EXAMPLE ONLY — every value here is a placeholder, NOT a real secret. Replace each
# REPLACE_ME before deploying and source real values from your secret manager
# (sealed-secrets, external-secrets, SOPS, ...); never commit real credentials.
#
# Live mode needs the service's own API key plus the Cleverbase OIDC client credentials,
# the registered redirect URI, and (for B-T) the RFC 3161 TSA endpoint + auth + policy OID.
apiVersion: v1
kind: Secret
metadata:
  name: signing-service-secrets
  labels:
    app.kubernetes.io/name: signing-service
    app.kubernetes.io/part-of: cleverbase-reference-integration
type: Opaque
stringData:
  # Gates the reference REST API the web frontend calls.
  REFSVC_API_KEY: "REPLACE_ME"
  # Cleverbase OIDC client credentials.
  REFSVC_CLIENT_ID: "REPLACE_ME"
  REFSVC_CLIENT_SECRET: "REPLACE_ME"
  # Must match the redirect URI registered with Cleverbase.
  REFSVC_REDIRECT_URI: "https://REPLACE_ME/return"
  # RFC 3161 timestamp authority (required when conformance is B-T).
  REFSVC_TSA_URL: "https://REPLACE_ME/tsr"
  # TSA Authorization header value, e.g. "Bearer REPLACE_ME" (blank if the TSA is open).
  REFSVC_TSA_AUTH: "REPLACE_ME"
  # TSA request policy OID.
  REFSVC_TSA_POLICY: "REPLACE_ME"
