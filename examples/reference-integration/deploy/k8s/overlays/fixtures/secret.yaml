# EXAMPLE ONLY — these are placeholders, NOT real secrets. Replace every REPLACE_ME
# before deploying, and source real values from your secret manager (sealed-secrets,
# external-secrets, SOPS, ...) rather than committing them.
#
# In fixtures mode the only secret the service needs is its own API key, which gates the
# reference REST API the web frontend calls.
apiVersion: v1
kind: Secret
metadata:
  name: signing-service-secrets
  labels:
    app.kubernetes.io/name: signing-service
    app.kubernetes.io/part-of: cleverbase-reference-integration
type: Opaque
stringData:
  REFSVC_API_KEY: "REPLACE_ME"
